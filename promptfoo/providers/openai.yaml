# Modelo EVALUADO: hace de agente de email y redacta las respuestas.
# Todo lo listado aquí se evalúa (una columna por modelo en los resultados).
# El modelo JUEZ de los asserts llm-rubric NO va aquí: se define en
# promptfooconfig.yaml -> defaultTest.options.provider (gpt-4.1-mini).

- id: openai:chat:gpt-5.6-terra
  label: gpt-5.6-terra
  config:
    apiKeyEnvar: API_KEY_OPENAI
    max_completion_tokens: 4096
    temperature: 1
    # Esquema que nos regresa nuestro Agente
    response_format:
      type: json_schema
      json_schema:
        name: response_schema
        strict: true
        schema:
          type: object
          properties:
            answer:
              type: string
          required: [answer]
          additionalProperties: false
