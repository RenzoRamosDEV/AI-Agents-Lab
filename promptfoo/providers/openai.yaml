# Este sera el modelo evaluador
- id: openai:chat:gpt-5.6-terra
  label: gpt-5.6-terra
  config:
    apiKeyEnvar: API_KEY_OPENAI
    # Tope de tokens de la respuesta, holgado para que ningún borrador salga cortado
    max_completion_tokens: 4096
    temperature: 1
    # Este es el formato que entrega mi agente (Puede ser distinto en otro caso)
    response_format:
      type: json_schema
      json_schema:
        name: response_schema
        strict: true
        schema:
          type: object
          properties:
            answer:
              type: string
          required: [answer]
          additionalProperties: false
