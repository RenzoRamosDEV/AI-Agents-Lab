
- id: openai:chat:gpt-5.6-terra
  label: gpt-5.6-terra
  config:
    apiKeyEnvar: API_KEY_OPENAI
    max_completion_tokens: 4096
    temperature: 1
    # Esquema que nos regresa nuestro Agente
    response_format:
      type: json_schema
      json_schema:
        name: response_schema
        strict: true
        schema:
          type: object
          properties:
            answer:
              type: string
          required: [answer]
          additionalProperties: false
